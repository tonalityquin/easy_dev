buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.google.gms:google-services:4.4.2"
    }
}


allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects { subproject ->
    subproject.pluginManager.withPlugin("com.android.library") {
        if (subproject.name == "tflite_flutter") {
            def androidComponents = subproject.extensions.getByName("androidComponents")
            androidComponents.finalizeDsl { androidExtension ->
                androidExtension.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
                androidExtension.compileOptions.targetCompatibility = JavaVersion.VERSION_17
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
