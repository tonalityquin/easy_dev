plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace = "com.quintus.dev"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId = "com.quintus.dev"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def keystoreProperties = new Properties()
            def keystorePropertiesFile = rootProject.file('key.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release

            ndk {
                abiFilters.clear()
                abiFilters.addAll(["armeabi-v7a", "arm64-v8a"])
            }

            minifyEnabled true
            shrinkResources false
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
            buildConfigField "boolean", "R8_MINIFY_ENABLED", "true"
            buildConfigField "boolean", "R8_OPTIMIZE_ENABLED", "true"
            buildConfigField "boolean", "RESOURCE_SHRINK_ENABLED", "false"
        }

        debug {
            minifyEnabled false
            shrinkResources false
            buildConfigField "boolean", "R8_MINIFY_ENABLED", "false"
            buildConfigField "boolean", "R8_OPTIMIZE_ENABLED", "false"
            buildConfigField "boolean", "RESOURCE_SHRINK_ENABLED", "false"
        }
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/*"]
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.12.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
}
